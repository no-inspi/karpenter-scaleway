name: Bug report
description: Something does not work as documented.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Security issues must not be reported here, see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: Chart / image version (e.g. 0.4.7).
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - Kapsule
        - Kosmos (experimental)
    validations:
      required: true
  - type: input
    id: k8s
    attributes:
      label: Kubernetes version and CNI
      placeholder: 1.34.1, cilium
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include the ScalewayNodeClass and NodePool (remove any secret).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Controller logs
      description: Remove keys, tokens and IDs you do not want to share.
      render: text
