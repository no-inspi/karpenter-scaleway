# .github/workflows/ci.yml — checks on pull requests and pushes to master.
# Needs no secrets. Real-cluster E2E tests live in e2e.yml.

name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

# Cancel in-progress runs when a new commit is pushed to the same PR/ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.x"
  GOLANGCI_LINT_VERSION: v1.64.8

jobs:
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # `make lint-ci` (go run @v1.64.8) instead of the golangci-lint action:
      # the released binary is built with Go 1.24 and refuses to lint a
      # codebase targeting Go 1.26 (see go.mod). `go run` rebuilds it with
      # the runner's 1.26.x toolchain. Costs +60-90s vs a cached binary.
      # Revisit when moving to golangci-lint v2.
      - name: Run golangci-lint via make lint-ci
        run: make lint-ci

  unit:
    name: Unit tests (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run unit tests
        run: make unit

  envtest:
    name: Envtest integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run envtest
        # The envtest target calls test/e2e/setup-envtest.sh, which installs
        # setup-envtest and resolves KUBEBUILDER_ASSETS for k8s 1.34.0.
        run: make envtest

  build:
    name: Build (linux/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build all packages
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: make build
