# .github/workflows/release.yml — release on tag push.
# Fires on a vX.Y.Z tag push: logs into the Scaleway Container Registry,
# runs `make release` (controller image + Helm chart + cross-compiled
# binaries), and uploads the binaries + SHA256SUMS to a DRAFT GitHub
# Release. The human publishes the draft after editing the notes
# (see RELEASE.md).

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create the GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.x"

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Log in to Scaleway Container Registry (image + chart)
        env:
          SCW_CR_TOKEN: ${{ secrets.SCW_CR_TOKEN }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          make release-image-login
          make release-chart-login

      - name: Build & push image, chart, and binaries
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          echo "Releasing version: $VERSION (from tag $REF_NAME)"
          make release IMAGE_TAG="$VERSION" BINARY_VERSION="$VERSION" CHART_VERSION="$VERSION"

      - name: Create draft GitHub Release with binaries + checksums
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
