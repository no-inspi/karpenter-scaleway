apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "karpenter-scaleway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karpenter-scaleway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "karpenter-scaleway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "karpenter-scaleway.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "karpenter-scaleway.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: {{ include "karpenter-scaleway.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            - name: probes
              containerPort: {{ .Values.probes.port }}
              protocol: TCP
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SCW_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "karpenter-scaleway.secretName" . }}
                  key: SCW_ACCESS_KEY
            - name: SCW_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "karpenter-scaleway.secretName" . }}
                  key: SCW_SECRET_KEY
            {{- if .Values.scaleway.kosmos.apiKey }}
            - name: SCW_KOSMOS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "karpenter-scaleway.secretName" . }}
                  key: SCW_KOSMOS_API_KEY
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "karpenter-scaleway.fullname" . }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
