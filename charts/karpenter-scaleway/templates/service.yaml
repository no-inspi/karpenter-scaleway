apiVersion: v1
kind: Service
metadata:
  name: {{ include "karpenter-scaleway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karpenter-scaleway.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "karpenter-scaleway.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
    - name: probes
      port: {{ .Values.probes.port }}
      targetPort: probes
      protocol: TCP
