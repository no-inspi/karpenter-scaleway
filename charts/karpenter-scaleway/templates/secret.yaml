{{- if not .Values.scaleway.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "karpenter-scaleway.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karpenter-scaleway.labels" . | nindent 4 }}
type: Opaque
stringData:
  SCW_ACCESS_KEY: {{ required ".Values.scaleway.accessKey is required when existingSecret is empty" .Values.scaleway.accessKey | quote }}
  SCW_SECRET_KEY: {{ required ".Values.scaleway.secretKey is required when existingSecret is empty" .Values.scaleway.secretKey | quote }}
  {{- with .Values.scaleway.kosmos.apiKey }}
  SCW_KOSMOS_API_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
