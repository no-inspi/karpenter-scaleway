apiVersion: v1
kind: Namespace
metadata:
  name: karpenter-spike
---
apiVersion: v1
kind: Pod
metadata:
  name: stress-pod
  namespace: karpenter-spike
spec:
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          # > 4 vCPU minus system overhead → unschedulable on the empty
          # cluster, fits exactly on a freshly provisioned GP1-XS.
          cpu: "3500m"
          memory: "8Gi"
  tolerations:
    - operator: Exists  # tolerate any taint Karpenter may set on fresh nodes
